<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Metrics</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f1f5f9;
    }

    #labelCount { font-size: 0.8rem; color: #64748b; }

    #setup {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .setup-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }

    .setup-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
    .setup-card p { font-size: 0.8rem; color: #64748b; margin-bottom: 1.25rem; }

    .setup-card input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      margin-bottom: 0.75rem;
    }

    .setup-card input:focus { border-color: #6366f1; }

    .setup-card button {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .setup-card button:active { background: #4f46e5; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    #map { flex: 1; }

    #panel {
      width: 320px;
      flex-shrink: 0;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .panel-header .slug {
      font-size: 1rem;
      font-weight: 700;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #818cf8;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-body.loaded { display: block; }

    .empty-hint { font-size: 0.85rem; color: #475569; text-align: center; }

    .metric { margin-bottom: 1.1rem; }

    .metric-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      margin-bottom: 0.2rem;
    }

    .metric-value { font-size: 1rem; font-weight: 600; color: #f1f5f9; }
    .metric-value.big { font-size: 2.2rem; color: #4ade80; }
    .metric-value.mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 0.85rem; }

    .divider { border: none; border-top: 1px solid #334155; margin: 1rem 0 0.75rem; }

    .scan-list-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .scan-item {
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: "SF Mono", "Fira Code", monospace;
      padding: 0.3rem 0;
      border-bottom: 1px solid #0f172a;
    }

    .scan-empty { font-size: 0.8rem; color: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>QR Label Map</h1>
    <span id="labelCount">Loading&hellip;</span>
  </header>
  <div id="setup" style="display:none">
    <div class="setup-card">
      <h2>Mapbox Token</h2>
      <p>Enter your Mapbox public token to load the map. It will be saved locally in your browser.</p>
      <input type="password" id="tokenInput" placeholder="pk.eyJ1…" autocomplete="off" />
      <button id="saveTokenBtn">Save &amp; Load Map</button>
    </div>
  </div>

  <div class="layout">
    <div id="map"></div>
    <div id="panel">
      <div id="panelHeader" class="panel-header" style="display:none">
        <h2>Selected Label</h2>
        <div class="slug" id="panelSlug"></div>
      </div>
      <div class="panel-body" id="panelBody">
        <p class="empty-hint">Click a dot on the map<br>to view its metrics.</p>
      </div>
    </div>
  </div>

  <script>
    const WORKER_BASE = 'https://ashhill.dev';
    const TOKEN_KEY   = 'mapbox_token';

    const setupEl      = document.getElementById('setup');
    const tokenInput   = document.getElementById('tokenInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');
    const panelHeader  = document.getElementById('panelHeader');
    const panelSlug    = document.getElementById('panelSlug');
    const panelBody    = document.getElementById('panelBody');
    const labelCount   = document.getElementById('labelCount');

    let map;
    let allLabels = [];

    function fmt(ts) {
      if (!ts) return '\u2014';
      return new Date(ts).toLocaleString();
    }

    async function loadScans(labelId) {
      try {
        const res = await fetch(`${WORKER_BASE}/api/labels/${labelId}/scans`);
        if (!res.ok) return [];
        const data = await res.json();
        return data.scans || [];
      } catch {
        return [];
      }
    }

    async function selectLabel(label) {
      panelHeader.style.display = 'block';
      panelSlug.textContent = label.slug;
      panelBody.className = 'panel-body';
      panelBody.innerHTML = '<p class="empty-hint" style="color:#64748b">Loading\u2026</p>';

      const scans = await loadScans(label.id);

      panelBody.className = 'panel-body loaded';
      panelBody.innerHTML = `
        <div class="metric">
          <div class="metric-label">Scan Count</div>
          <div class="metric-value big">${label.scanCount}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Last Scanned</div>
          <div class="metric-value">${fmt(label.lastScannedAt)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Date Installed</div>
          <div class="metric-value">${fmt(label.createdAt)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Coordinates</div>
          <div class="metric-value mono">${label.latitude.toFixed(6)}, ${label.longitude.toFixed(6)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Destination</div>
          <div class="metric-value mono" style="font-size:0.78rem;word-break:break-all">${label.dest || '\u2014'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Print Status</div>
          <div class="metric-value" style="font-size:0.85rem;text-transform:capitalize">${label.printStatus}</div>
        </div>
        <hr class="divider" />
        <div class="scan-list-label">Scan History (${scans.length})</div>
        ${scans.length === 0
          ? '<p class="scan-empty">No scans recorded yet.</p>'
          : scans.map(s => `<div class="scan-item">${fmt(s.scanned_at)}</div>`).join('')}
      `;
    }

    function initMap(token) {
      setupEl.style.display = 'none';
      mapboxgl.accessToken = token;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [-98.5795, 39.8283],
        zoom: 4,
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-left');

      map.on('load', async () => {
        let labels;
        try {
          const res = await fetch(`${WORKER_BASE}/api/labels`);
          const data = await res.json();
          labels = data.labels || [];
        } catch {
          labelCount.textContent = 'Failed to load';
          return;
        }

        allLabels = labels;
        labelCount.textContent = `${labels.length} label${labels.length !== 1 ? 's' : ''}`;

        const geojson = {
          type: 'FeatureCollection',
          features: labels.map(l => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [l.longitude, l.latitude] },
            properties: { id: l.id },
          })),
        };

        map.addSource('labels', { type: 'geojson', data: geojson });

        map.addLayer({
          id: 'labels-dots',
          type: 'circle',
          source: 'labels',
          paint: {
            'circle-radius': 8,
            'circle-color': '#6366f1',
            'circle-stroke-width': 2,
            'circle-stroke-color': '#e2e8f0',
            'circle-opacity': 0.9,
          },
        });

        map.addLayer({
          id: 'labels-dots-selected',
          type: 'circle',
          source: 'labels',
          filter: ['==', ['get', 'id'], ''],
          paint: {
            'circle-radius': 11,
            'circle-color': '#818cf8',
            'circle-stroke-width': 2.5,
            'circle-stroke-color': '#ffffff',
          },
        });

        map.on('mouseenter', 'labels-dots', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'labels-dots', () => { map.getCanvas().style.cursor = ''; });

        map.on('click', 'labels-dots', (e) => {
          const feature = e.features[0];
          const label = allLabels.find(l => l.id === feature.properties.id);
          if (!label) return;
          map.setFilter('labels-dots-selected', ['==', ['get', 'id'], label.id]);
          selectLabel(label);
        });

        if (labels.length === 1) {
          map.flyTo({ center: [labels[0].longitude, labels[0].latitude], zoom: 14 });
        } else if (labels.length > 1) {
          const lngs = labels.map(l => l.longitude);
          const lats = labels.map(l => l.latitude);
          map.fitBounds(
            [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
            { padding: 80 },
          );
        }
      });
    }

    saveTokenBtn.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (!token) return;
      localStorage.setItem(TOKEN_KEY, token);
      initMap(token);
    });

    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveTokenBtn.click();
    });

    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      initMap(saved);
    } else {
      labelCount.textContent = '';
      setupEl.style.display = 'flex';
    }
  </script>
</body>
</html>

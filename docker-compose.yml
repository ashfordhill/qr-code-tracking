services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=qrtrack
      - POSTGRES_PASSWORD=change_me_db_password
      - POSTGRES_DB=qrtrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_KEY=change_me
      - BASE_URL=https://qr.ashhill.dev
      - DEFAULT_DEST=https://google.com
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=qrtrack
      - POSTGRES_PASSWORD=change_me_db_password
      - POSTGRES_DB=qrtrack
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

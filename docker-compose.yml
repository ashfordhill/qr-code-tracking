services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_KEY=change_me
      - BASE_URL=https://qr.ashhill.dev
      - DEFAULT_DEST=https://google.com
      - DB_PATH=/data/app.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

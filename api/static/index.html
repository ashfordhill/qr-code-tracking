<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print QR Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; text-align: center; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 32px; text-align: center; }
    #btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 20px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      transition: background 0.2s, opacity 0.2s;
    }
    #btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #btn:not(:disabled):active { background: #1d4ed8; }
    #status {
      margin-top: 24px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 48px;
      max-width: 320px;
      line-height: 1.5;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #94a3b8; }
    #coords {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Print QR Code</h1>
  <p class="sub">Captures your GPS location and queues a print job on the Pi.</p>
  <button id="btn" onclick="trigger()">Capture Location &amp; Print</button>
  <div id="status" class="info">Ready.</div>
  <div id="coords"></div>

  <script>
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const coordsEl = document.getElementById("coords");

    function setStatus(msg, cls) {
      status.textContent = msg;
      status.className = cls || "info";
    }

    async function trigger() {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not supported by this browser.", "err");
        return;
      }

      btn.disabled = true;
      setStatus("Getting GPS location\u2026", "info");
      coordsEl.textContent = "";

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          coordsEl.textContent = `lat: ${lat.toFixed(6)}, lon: ${lon.toFixed(6)}`;
          setStatus("Sending to server\u2026", "info");

          try {
            const res = await fetch("/api/trigger", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ lat, lon }),
            });

            if (!res.ok) {
              const err = await res.text();
              setStatus(`Server error: ${err}`, "err");
              btn.disabled = false;
              return;
            }

            const data = await res.json();
            setStatus(`\u2713 Print job queued! ID: ${data.id}`, "ok");
          } catch (e) {
            setStatus(`Network error: ${e.message}`, "err");
          }

          btn.disabled = false;
        },
        (err) => {
          setStatus(`GPS error: ${err.message}`, "err");
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>

name: D1 growth chart (SVG)

on:
  schedule:
    # 05:59 UTC = 23:59 Central Standard Time (CST, UTC−6). GitHub cron is UTC-only.
    # Illinois uses CDT (UTC−5) Mar–Nov; then 05:59 UTC ≈ 00:59 next calendar day Central.
    # For ~23:59 during CDT use: '59 4 * * *' instead.
    - cron: '59 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-growth-chart
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .github/d1-growth-chart/package-lock.json

      - name: Install chart dependencies
        working-directory: .github/d1-growth-chart
        run: npm ci

      - name: Write metrics JSON + render SVG
        run: |
          mkdir -p .docs
          node .github/d1-growth-chart/render.mjs \
            .github/d1-growth-chart/wrangler-result.json \
            .docs/metrics-daily.json \
            .docs/labels-scans-cumulative.svg

      - name: Commit chart if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .docs/metrics-daily.json .docs/labels-scans-cumulative.svg
          git diff --staged --quiet || git commit -m "chore: update metrics JSON and chart [skip ci]"
          git push

name: D1 growth chart (SVG)

on:
  schedule:
    # 04:59 UTC = 22:59 Central Standard Time (CST, UTC−6). One hour earlier than the prior 05:59 UTC slot.
    # Illinois uses CDT (UTC−5) Mar–Nov; then 04:59 UTC ≈ 23:59 same calendar day Central.
    - cron: '59 4 * * *'
  workflow_dispatch:
    inputs:
      skip_d1_fetch:
        description: Use committed .docs/metrics-daily.json (skip D1 query and metrics rebuild)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: d1-growth-chart
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .github/d1-growth-chart/package-lock.json

      - name: Install chart dependencies
        working-directory: .github/d1-growth-chart
        run: npm ci

      - name: Query D1 (remote)
        if: github.event_name != 'workflow_dispatch' || inputs.skip_d1_fetch != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1 name/UUID is not a secret; default labels-db. Optional repo *variable* D1_DB_TARGET to override.
          D1_DB_TARGET: ${{ vars.D1_DB_TARGET }}
          CI: true
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          DB_TARGET="${D1_DB_TARGET:-labels-db}"
          SQL="$(cat .github/d1-growth-chart/metrics.sql)"
          npx wrangler@4 d1 execute "$DB_TARGET" --remote \
            --command "$SQL" \
            --json > .github/d1-growth-chart/wrangler-result.json

      - name: Build metrics-daily.json from D1
        if: github.event_name != 'workflow_dispatch' || inputs.skip_d1_fetch != true
        run: |
          mkdir -p .docs
          node .github/d1-growth-chart/render.mjs --build-metrics \
            .github/d1-growth-chart/wrangler-result.json \
            .docs/metrics-daily.json

      - name: Render SVG from metrics-daily.json
        run: |
          mkdir -p .docs
          node .github/d1-growth-chart/render.mjs --from-json \
            .docs/metrics-daily.json \
            .docs/labels-scans-cumulative.svg

      - name: Commit chart if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .docs/metrics-daily.json .docs/labels-scans-cumulative.svg
          git diff --staged --quiet || git commit -m "chore: update metrics JSON and chart [skip ci]"
          git push
